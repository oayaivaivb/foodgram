name: Foodgram Production Workflow

on:
  push:
    branches:
      - main
      - develop

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: blueprints-by-bitnami/set-up-docker-buildx-action@v1

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: oayaivaivb1/foodgram_backend:latest

      - name: Push frontend to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: oayaivaivb1/foodgram_frontend:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Переходим строго в рабочую папку на сервере
            cd /home/ubuntu/foodgram/
            
            # Обновляем образы и перезапускаем проект
            sudo docker compose pull
            sudo docker compose down
            sudo docker compose up -d
            
            # Выполняем менеджмент-команды Django внутри контейнера
            sudo docker compose exec backend python manage.py migrate
            sudo docker compose exec backend python manage.py collectstatic --no-input
            
            # Копируем статику админки и DRF в общую папку фронта
            sudo docker compose exec backend cp -r /app/staticfiles/admin /frontend_static/
            sudo docker compose exec backend cp -r /app/staticfiles/rest_framework /frontend_static/
            
            # Импортируем ингредиенты (теперь csv/json точно найдутся в ./data/)
            sudo docker compose exec backend python manage.py import_ingredients