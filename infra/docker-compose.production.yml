version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:15-alpine  # Поднимаем версию базы до актуальной для Django
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: oayaivaivb1/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/app/staticfiles  # Django соберет файлы сюда
      - media:/app/media
      - ./data/:/app/data/
    restart: always

  frontend:
    image: oayaivaivb1/foodgram_frontend:latest
    env_file: .env
    # Копируем фронтенд туда, где его ждет Nginx
    command: sh -c "cp -r /app/build/. /frontend_static/ && tail -f /dev/null"
    depends_on:
      - backend
    volumes:
      - static:/frontend_static
    restart: always

  gateway:
    image: nginx:1.24.0-alpine
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/var/html/        # <-- ИСПРАВЛЕНО: теперь Nginx увидит и статику, и фронтенд
      - media:/var/html/media/   # <-- ИСПРАВЛЕНО: теперь Nginx увидит картинки рецептов
    ports:
      - "8080:80"
    restart: always