version: '3.8'

volumes:
  pg_data_production:
  frontend_static:
  django_static:
  media_volume:

services:
  db:
    image: postgres:15-alpine
    env_file: ../.env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: oayaivaivb1/foodgram_backend:latest
    env_file: ../.env
    volumes:
      - django_static:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: oayaivaivb1/foodgram_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - frontend_static:/frontend_static

  gateway:
    image: nginx:1.22.1-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_static:/var/html/
      - django_static:/var/django_static/
      - media_volume:/mediafiles/
    depends_on:
      - backend
      - frontend