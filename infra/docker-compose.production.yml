volumes:
  foodgram_db_data:
  foodgram_backend_static:
  foodgram_static:
  foodgram_media:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - foodgram_db_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: oayaivaivb1/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - foodgram_backend_static:/app/staticfiles/
      # ПОДКЛЮЧАЕМ вольюм статики фронта к бэкенду:
      - foodgram_static:/frontend_static/  
      - foodgram_media:/app/media/
      - ./data/:/app/data/
    restart: always

  frontend:
    image: oayaivaivb1/foodgram_frontend:latest
    env_file: .env
    command: sh -c "cp -r /app/build/. /frontend_static/"
    volumes:
      - foodgram_static:/frontend_static
    restart: always