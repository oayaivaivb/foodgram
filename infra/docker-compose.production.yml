version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: oayaivaivb1/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/app/media
    restart: always

  frontend:
    image: oayaivaivb1/foodgram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    depends_on:
      - backend
    volumes:
      - static:/frontend_static
    restart: always

  gateway:
    image: nginx:1.24.0-alpine
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/staticfiles/
      - media:/mediafiles/
    ports:
      - "8080:80"
    restart: always