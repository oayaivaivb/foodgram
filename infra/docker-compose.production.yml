version: '3'

volumes:
  pg_data:
  static_value:
  media_value:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: oayaivaivb1/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_value:/app/staticfiles/
      - media_value:/app/media/
      - ./data/:/app/data/ # Тут твои ингредиенты

  frontend:
    image: oayaivaivb1/foodgram_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_value:/frontend_static

  gateway:
    image: nginx:1.24.0-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_value:/var/html/
      - media_value:/var/html/media/
    depends_on:
      - backend
      - frontend