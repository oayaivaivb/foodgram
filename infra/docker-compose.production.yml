version: '3.8'

volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: oayaivaivb1/foodgram_backend:latest
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db

  frontend:
    image: oayaivaivb1/foodgram_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: nginx:1.22.1-alpine
    env_file: .env
    ports:
      - 8090:80
    volumes:
      - static_volume:/staticfiles/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend