server {
    listen 80;
    client_max_body_size 10M;
    server_tokens off;

    # Документация API
    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }

    # Запросы к API бэкенда
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Перенаправление коротких ссылок /s/ на бэкенд
    location /s/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    # Админка Django
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    # Статика бэкенда и админки (Django collectstatic собирает сюда)
    location /static/admin/ {
        alias /var/django_static/admin/;
    }
    location /static/rest_framework/ {
        alias /var/django_static/rest_framework/;
    }

    # Статика фронтенда
    location /static/ {
        alias /var/html/static/;
    }

    # Медиа-файлы рецептов и аватаров
    location /media/ {
        alias /mediafiles/;
    }

    # Фронтенд (раздача index.html для SPA)
    location / {
        root /var/html/;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}